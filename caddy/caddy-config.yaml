# caddy-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |


    jenkins.zymran.com {
        reverse_proxy http://10.201.0.5:8080
    }
    vault1.poc.zymran.com {
        reverse_proxy http://10.201.0.5:8200
    }

    ai-assistant-staging.tezbot.kz {
        encode gzip
        
        header {
            Access-Control-Allow-Origin *
            Access-Control-Allow-Credentials true
            Access-Control-Allow-Methods *
            Access-Control-Allow-Headers *
        }
        
        # Voice service routes - MUST come before general /api/v1/*
        route /api/v1/voice* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-voice-service-staging.ai-assistant-staging.svc.cluster.local:8004 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }

        # Chat backend routes - MUST come before general /api/v1/*
        route /api/v1/chat* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-chat-backend-staging.ai-assistant-staging.svc.cluster.local:8002 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
                header_up Upgrade {http.request.header.Upgrade}
                header_up Connection {http.request.header.Connection}
            }
        }
        
        # General API routes
        route /api/v1/* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-backend-staging.ai-assistant-staging.svc.cluster.local:8000 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }
        route /docs {
            reverse_proxy http://ai-assistant-service-backend-staging.ai-assistant-staging.svc.cluster.local:8000
        }
        route /* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-frontend-staging.ai-assistant-staging.svc.cluster.local:3000 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }
    }


    ai-assistant-prod.tezbot.kz {
        encode gzip
        
        header {
            Access-Control-Allow-Origin *
            Access-Control-Allow-Credentials true
            Access-Control-Allow-Methods *
            Access-Control-Allow-Headers *
        }
        
        # Voice service routes - MUST come before general /api/v1/*
        route /api/v1/voice* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-voice-service-prod.ai-assistant-prod.svc.cluster.local:8004 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }
        
        # General API routes
        route /api/v1/* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-backend-prod.ai-assistant-prod.svc.cluster.local:8000 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }
        route /docs {
            reverse_proxy http://ai-assistant-service-backend-prod.ai-assistant-prod.svc.cluster.local:8000
        }
        route /* {
            header >Location http:// https://
            reverse_proxy http://ai-assistant-service-frontend-prod.ai-assistant-prod.svc.cluster.local:3000 {
                header_up X-Forwarded-Proto {scheme}
                header_up Host {host}
            }
        }
    }
